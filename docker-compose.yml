services:
  shl-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shl-api:latest
    container_name: shl-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SHL_CORS_ORIGINS: "*"
      SHL_RATE_LIMIT_PER_MINUTE: "60"
    volumes:
      - ./cache:/app/cache
    mem_limit: 1g
    cpus: 2.0

  shl-poller:
    build:
      context: .
      dockerfile: Dockerfile
    image: shl-api:latest
    container_name: shl-poller
    restart: unless-stopped
    command: python -m src.cli poller-run --tick-interval 30
    volumes:
      - ./cache:/app/cache
    mem_limit: 512m
    cpus: 1.0

  shl-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: shl-api:latest
    container_name: shl-notifier
    restart: unless-stopped
    command: python -m src.cli notifier-run --tick-interval 5
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-credentials.json
      # SHL_FCM_DRY_RUN: "1"
    volumes:
      - ./cache:/app/cache
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    mem_limit: 256m
    cpus: 0.5
