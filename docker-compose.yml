services:
  shl-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shl-api:latest
    container_name: shl-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./cache:/app/cache
    mem_limit: 1g
    cpus: 2.0
