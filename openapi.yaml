openapi: "3.1.0"
info:
  title: SHL Data API
  description: |
    Read-only API for SHL (Swedish Hockey League) data scraped from SweHockey.
    Provides schedule, standings, game details, player/goalie stats, and team rosters.
  version: "1.0.0"
  contact:
    name: shl2026-backend

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /:
    get:
      operationId: root
      summary: List available API endpoints
      description: Returns all available endpoints with their HTTP methods and descriptions.
      responses:
        "200":
          description: Endpoint index
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: SHL Data API
                  version:
                    type: string
                    example: "0.1.0"
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          example: /seasons/{season_id}/standings
                        method:
                          type: string
                          example: GET
                        description:
                          type: string
                          example: Current standings computed from played games
                      required:
                        - path
                        - method
                        - description
                required:
                  - name
                  - version
                  - endpoints

  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /seasons/{season_id}/schedule:
    get:
      operationId: getSchedule
      summary: Full season schedule
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Season schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /seasons/{season_id}/games:
    get:
      operationId: getGames
      summary: All games, optionally filtered by date
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: date
          in: query
          required: false
          description: Filter games by date. If omitted, returns all games in the season.
          schema:
            type: string
            format: date
            example: "2025-09-13"
      responses:
        "200":
          description: Games (all or filtered by date)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "404":
          description: Schedule not yet fetched for this season

  /seasons/{season_id}/games/today:
    get:
      operationId: getTodaysGames
      summary: Today's upcoming/live games
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Today's games without a final result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"

  /seasons/{season_id}/games/live:
    get:
      operationId: getLiveGames
      summary: Today's games from the SweHockey Live page
      description: |
        Scraped from the SweHockey Live page for the season. Returns all games
        listed as upcoming or in-progress for today. Unlike /games/today (which
        filters the stored schedule by date), this fetches the dedicated Live page
        that shows real-time game status during game days. Data is refreshed every
        25 seconds by the poller and fetched on demand if not yet cached.
        The response meta includes `page_last_update` with the timestamp from the
        SweHockey page header indicating when their data was last refreshed.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Today's live/upcoming games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "502":
          description: Failed to fetch live games from upstream

  /seasons/{season_id}/games/played:
    get:
      operationId: getPlayedGames
      summary: All played games (with results)
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: All games with a final result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"

  /seasons/{season_id}/rounds:
    get:
      operationId: getRounds
      summary: Schedule grouped by round
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: All rounds with their games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundsResponse"

  /seasons/{season_id}/rounds/played:
    get:
      operationId: getPlayedRounds
      summary: Completed rounds only
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Rounds where all games have results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundsResponse"

  /seasons/{season_id}/rounds/next:
    get:
      operationId: getNextRound
      summary: Next unplayed round
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Next round with unplayed games
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoundResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /seasons/{season_id}/standings:
    get:
      operationId: getStandings
      summary: League standings (up to yesterday)
      description: |
        Computed from schedule data. Only includes games up to and including
        yesterday — today's live games are excluded to keep standings stable.
        Pre-season (no games played): returns all teams at rank 1, sorted alphabetically.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Current standings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"

  /seasons/{season_id}/standings/live:
    get:
      operationId: getLiveStandings
      summary: Live standings (includes today's games)
      description: |
        Standings merged with provisional live points from today's games.
        Movement shows position change compared to the base standings (before today).
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: Live standings with today's points included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"

  /seasons/{season_id}/players:
    get:
      operationId: getPlayerStats
      summary: Scoring leaders
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: team
          in: query
          required: false
          description: Filter by team abbreviation (e.g. SKE, FRÖ)
          schema:
            type: string
      responses:
        "200":
          description: Player scoring statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /seasons/{season_id}/goalies:
    get:
      operationId: getGoalieStats
      summary: Goalie statistics
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: team
          in: query
          required: false
          description: Filter by team abbreviation
          schema:
            type: string
      responses:
        "200":
          description: Goalie statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalieStatsResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /seasons/{season_id}/teams:
    get:
      summary: List teams with abbreviations for a season
      operationId: getSeasonTeams
      parameters:
        - name: season_id
          in: path
          required: true
          schema:
            type: integer
          description: SweHockey season/tournament ID
      responses:
        '200':
          description: Team list with abbreviations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamInfo'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Team info not yet fetched

  /seasons/{season_id}/players/{team}/{jersey}/stats:
    get:
      operationId: getPlayerStats
      summary: Dynamic game stats for a single player
      description: |
        Returns detailed game statistics for a player from the SweHockey PlayersByTeam page.
        Data is fetched on demand (not cached long-term) since stats change frequently.
        Includes GP, G, A, TP, PIM, +/-, GWG, PPG, SHG, SOG, SG%, faceoffs.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: team
          in: path
          required: true
          schema:
            type: string
          description: SweHockey team name (e.g. "Brynäs IF")
          example: "Brynäs IF"
        - name: jersey
          in: path
          required: true
          schema:
            type: integer
          description: Player jersey number
          example: 3
      responses:
        "200":
          description: Player game statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStatsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Failed to fetch stats from upstream

  /seasons/{season_id}/players/{team}/{jersey}:
    get:
      operationId: getMergedPlayerDetail
      summary: Single player with merged SweHockey roster + shl.se data
      description: |
        Returns a combined view of a player, merging SweHockey roster data
        (birthdate, height, weight, handedness, youth club) with shl.se enrichment
        (portrait URL, team code, shl.se UUID). Both sources are lazy-loaded on demand.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: team
          in: path
          required: true
          schema:
            type: string
          description: SweHockey team name (e.g. "Brynäs IF")
          example: "Brynäs IF"
        - name: jersey
          in: path
          required: true
          schema:
            type: integer
          description: Player jersey number
          example: 3
      responses:
        "200":
          description: Merged player detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedPlayerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Failed to fetch data from upstream

  /seasons/{season_id}/players/{team}:
    get:
      operationId: getMergedTeamPlayers
      summary: All players for a team with merged SweHockey + shl.se data
      description: |
        Returns all players on a team roster, merging SweHockey roster data with
        shl.se enrichment (portraits, UUIDs). Both sources are lazy-loaded on demand.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: team
          in: path
          required: true
          schema:
            type: string
          description: SweHockey team name (e.g. "Brynäs IF")
          example: "Brynäs IF"
      responses:
        "200":
          description: Merged team player list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergedTeamPlayersResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Failed to fetch roster data from upstream

  /portraits/{filename}:
    get:
      operationId: getPortrait
      summary: Player portrait image
      description: |
        Static file serving of cached player portrait images.
        Filename format: {team_code}_{jersey}.png (e.g. BIF_3.png).
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: "BIF_3.png"
      responses:
        "200":
          description: Portrait image (PNG)
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Portrait not found

  /games/{game_id}:
    get:
      operationId: getGameDetail
      summary: Game detail (score, events, team stats)
      description: Always fetches fresh data from SweHockey. Suitable for live game polling.
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full game detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /devices:
    post:
      operationId: registerDevice
      summary: Register device for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "200":
          description: Device registered
    delete:
      operationId: unregisterDevice
      summary: Unregister device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUnregistration"
      responses:
        "200":
          description: Device unregistered

components:
  parameters:
    SeasonId:
      name: season_id
      in: path
      required: true
      schema:
        type: integer
        example: 18263

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string

  schemas:
    Meta:
      type: object
      description: Response metadata with freshness info
      properties:
        generated_at:
          type: string
          format: date-time
        season_id:
          type: string
        source_fetched_at:
          type: string
          format: date-time
        page_last_update:
          type: string
          nullable: true
          description: Timestamp from the SweHockey page header indicating when their data was last refreshed (e.g. '2026-08-07 17:21:47')

    ScheduleEntry:
      type: object
      properties:
        game_id:
          type: integer
          nullable: true
          description: "Numeric game ID extracted from game_url"
          example: 1004308
        date:
          type: string
          format: date
          example: "2025-09-13"
        time:
          type: string
          example: "19:00"
        home_team:
          type: string
          example: "Brynäs IF"
        away_team:
          type: string
          example: "Växjö Lakers HC"
        game_result:
          type: string
          example: "4 - 7"
          description: Empty string if game hasn't been played yet
        periods:
          type: string
          example: "(1-2, 2-3, 1-2)"
        spectators:
          type: string
        venue:
          type: string
        game_url:
          type: string
          example: "https://stats.swehockey.se/Game/Events/1004308"
        round:
          type: string
        status:
          type: string
          description: "Game status during live games (e.g. '2nd period (01:49)', 'Waiting for 1st period'). Empty when not live."
        game_clock:
          type: string
          description: "Current game clock parsed from status (e.g. '01:49'). Empty when not in progress."
          example: "01:49"
        current_period:
          type: string
          description: "Current period parsed from status (e.g. '2nd period'). Empty when not in progress."
          example: "2nd period"
        overtime:
          type: string
          enum: ["", "OT", "SO"]
          description: Derived from period count
        game_state:
          type: string
          enum: ["not_started", "ongoing", "intermission", "overtime", "shootout", "finished", "finished_overtime", "finished_shootout"]
          description: "Computed game state: not_started, ongoing (active play), intermission (between periods), overtime (4th period), shootout (5th+ period), finished (regulation), finished_overtime, finished_shootout"

    StandingsRow:
      type: object
      properties:
        rank:
          type: integer
        team:
          type: string
          example: "Skellefteå AIK"
        team_abbr:
          type: string
          description: Team abbreviation (e.g. SKE, FRÖ)
          example: "SKE"
        games_played:
          type: integer
        w:
          type: integer
          description: Regulation wins
        t:
          type: integer
          description: Games that went to OT/SO
        l:
          type: integer
          description: Regulation losses
        goals_for:
          type: integer
        goals_against:
          type: integer
        goal_difference:
          type: integer
        tp:
          type: integer
          description: Total points
        otw:
          type: integer
          description: Overtime wins
        otl:
          type: integer
          description: Overtime losses
        gwsw:
          type: integer
          description: Game-winning shot wins (shootout)
        gwsl:
          type: integer
          description: Game-winning shot losses (shootout)
        movement:
          type: integer
          description: Position change since last snapshot (negative = moved up, positive = moved down)

    PlayerStat:
      type: object
      properties:
        rank:
          type: integer
        jersey:
          type: integer
        name:
          type: string
          example: "Lindberg, Oscar"
        team:
          type: string
          example: "SKE"
        position:
          type: string
          enum: ["CE", "LW", "RW", "LD", "RD"]
        games_played:
          type: integer
        goals:
          type: integer
        assists:
          type: integer
        total_points:
          type: integer
        points_per_game:
          type: number
          format: float
        penalty_minutes:
          type: integer
        plus_minus:
          type: integer

    GoalieStat:
      type: object
      properties:
        rank:
          type: integer
        jersey:
          type: integer
        name:
          type: string
          example: "Normann, Tobias"
        team:
          type: string
          example: "FRÖ"
        games_played:
          type: integer
        games_played_in:
          type: integer
        minutes_in_play:
          type: string
          example: "1425:53"
        shots_on_goal:
          type: integer
        goals_against:
          type: integer
        goals_against_avg:
          type: number
          format: float
        saves:
          type: integer
        save_percentage:
          type: number
          format: float
        shutouts:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        win_percentage:
          type: number
          format: float

    RosterEntry:
      type: object
      properties:
        team:
          type: string
          example: "Brynäs IF"
        jersey:
          type: integer
        name:
          type: string
          example: "Djoos, Christian"
        birthdate:
          type: string
          format: date
          example: "1994-08-06"
        position:
          type: string
        handedness:
          type: string
          enum: ["L", "R"]
        height:
          type: integer
          description: Height in cm
        weight:
          type: integer
          description: Weight in kg
        nationality:
          type: string
          example: "SWE"
        youth_club:
          type: string

    TeamInfo:
      type: object
      properties:
        team:
          type: string
          description: Full team name
          example: "Brynäs IF"
        abbreviation:
          type: string
          description: Official team abbreviation
          example: "BIF"
        logo_url:
          type: string
          description: Team logo URL from shl.se
          example: "https://www.shl.se/team_logos/bif.png"
      required:
        - team
        - abbreviation

    Score:
      type: object
      properties:
        current:
          type: string
          example: "4-7"
        home_score:
          type: integer
        away_score:
          type: integer
        periods:
          type: array
          items:
            type: string
          example: ["1-2", "2-3", "1-2"]
        current_period:
          type: integer
          nullable: true
        state:
          type: string
          nullable: true
          example: "Final Score"

    GameInfo:
      type: object
      properties:
        home_team:
          type: string
        away_team:
          type: string
        arena:
          type: string
        date_time:
          type: string
        league:
          type: string
        is_overtime:
          type: boolean
        is_shootout:
          type: boolean

    Action:
      type: object
      properties:
        period:
          type: string
          example: "1st period"
        game_time:
          type: string
          example: "03:45"
        event_type:
          type: string
          enum: ["goal", "penalty", "GWS", "PS"]
        team_abbrev:
          type: string
        player_text:
          type: string
        players:
          type: array
          items:
            type: string
        player_numbers:
          type: array
          items:
            type: integer
        is_goal:
          type: boolean
        goal:
          type: object
          nullable: true
          properties:
            home_score:
              type: integer
            away_score:
              type: integer
            strength:
              type: string
            qualifier:
              type: string
              nullable: true
        penalty_reason:
          type: string
          nullable: true
        penalty_time_range:
          type: object
          nullable: true
          properties:
            start:
              type: string
            end:
              type: string

    Round:
      type: object
      properties:
        round:
          type: string
        games:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"

    DeviceRegistration:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string
        platform:
          type: string
          default: android

    DeviceUnregistration:
      type: object
      required:
        - fcm_token
      properties:
        fcm_token:
          type: string

    # Response envelopes
    ScheduleResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"
        meta:
          $ref: "#/components/schemas/Meta"

    StandingsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StandingsRow"
        meta:
          $ref: "#/components/schemas/Meta"

    PlayerStatsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlayerStat"
        meta:
          $ref: "#/components/schemas/Meta"

    GoalieStatsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GoalieStat"
        meta:
          $ref: "#/components/schemas/Meta"

    RoundsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Round"
        meta:
          $ref: "#/components/schemas/Meta"

    RoundResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Round"
        meta:
          $ref: "#/components/schemas/Meta"

    GameDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            game:
              $ref: "#/components/schemas/GameInfo"
            score:
              $ref: "#/components/schemas/Score"
            teams:
              type: object
              additionalProperties:
                type: object
                description: Team stats (shots, saves, pim, pp)
            actions:
              type: array
              items:
                $ref: "#/components/schemas/Action"
        meta:
          $ref: "#/components/schemas/Meta"

    MergedPlayer:
      type: object
      description: Combined player data from SweHockey roster and shl.se
      properties:
        team:
          type: string
          example: "Brynäs IF"
        jersey:
          type: integer
          example: 3
        name:
          type: string
          example: "Djoos, Christian"
        birthdate:
          type: string
          format: date
          example: "1994-08-06"
        position:
          type: string
          example: "RD"
        handedness:
          type: string
          enum: ["L", "R"]
        height:
          type: integer
          description: Height in cm
          example: 181
        weight:
          type: integer
          description: Weight in kg
          example: 82
        nationality:
          type: string
          example: "SWE"
        youth_club:
          type: string
          example: "Brynäs IF"
        first_name:
          type: string
          description: From shl.se (empty if unavailable)
          example: "Christian"
        last_name:
          type: string
          description: From shl.se (empty if unavailable)
          example: "Djoos"
        portrait_url:
          type: string
          description: Relative URL to cached portrait image (empty if unavailable)
          example: "/portraits/BIF_3.png"
        team_code:
          type: string
          description: Short team code from shl.se (empty if unavailable)
          example: "BIF"
        shl_se_uuid:
          type: string
          description: Player UUID on shl.se (empty if unavailable)
          example: "qQ9-0473YO4F2"

    MergedPlayerResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/MergedPlayer"
        meta:
          $ref: "#/components/schemas/Meta"

    MergedTeamPlayersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MergedPlayer"
        meta:
          allOf:
            - $ref: "#/components/schemas/Meta"
            - type: object
              properties:
                count:
                  type: integer
                  description: Number of players returned

    TeamPlayerStat:
      type: object
      description: Dynamic game statistics for a player from PlayersByTeam
      properties:
        team:
          type: string
          example: "Brynäs IF"
        rank:
          type: integer
        jersey:
          type: integer
          example: 3
        name:
          type: string
          example: "Djoos, Christian"
        position:
          type: string
          example: "RD"
        games_played:
          type: integer
        goals:
          type: integer
        assists:
          type: integer
        total_points:
          type: integer
        penalty_minutes:
          type: integer
        plus:
          type: integer
          description: Goals for while on ice
        minus:
          type: integer
          description: Goals against while on ice
        plus_minus:
          type: integer
        gwg:
          type: integer
          description: Game-winning goals
        ppg:
          type: integer
          description: Power-play goals
        shg:
          type: integer
          description: Short-handed goals
        sog:
          type: integer
          description: Shots on goal
        sg_pct:
          type: number
          format: float
          nullable: true
          description: Shooting percentage (null if N/A)
        fo_won:
          type: integer
          description: Faceoffs won
        fo_lost:
          type: integer
          description: Faceoffs lost
        fo_total:
          type: integer
          description: Total faceoffs
        fo_pct:
          type: number
          format: float
          nullable: true
          description: Faceoff win percentage (null if N/A)

    PlayerStatsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TeamPlayerStat"
        meta:
          $ref: "#/components/schemas/Meta"
